name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── 1. LINTER ────────────────────────────────────────────────
  linter:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Rodar ESLint
        run: npm run lint

  # ── 2. TESTES + COBERTURA ────────────────────────────────────
  testes:
    name: Jest + Coverage
    runs-on: ubuntu-latest
    needs: linter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Rodar testes com cobertura
        run: npm test -- --coverage --json --outputFile=jest-results.json

      - name: Publicar relatorio de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ── 3. BUILD ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4

      - name: Empacotar arquivos estaticos
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r assets dist/

      - name: Salvar build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  # ── 4. DEPLOY — AZURE STATIC WEB APPS ────────────────────────
  deploy:
    name: Deploy Azure
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      - name: Deploy para Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/
          output_location: ""
          skip_app_build: true
